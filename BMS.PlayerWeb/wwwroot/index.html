<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BMS - Billiard Club</title>
    <base href="/" />
    <!-- PWA: cài như app (Chrome Android / máy tính) và "Thêm vào MH chính" trên iOS. -->
    <meta name="description" content="Quản lý bàn chơi, đặt bàn, thuê/mua cơ và ghép trận - tất cả trong một hệ thống." />
    <meta name="theme-color" content="#2563EB" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BMS Billiard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Phông theo hệ thiết kế BilliardHub: Plus Jakarta Sans (tiêu đề) + Be Vietnam Pro
         (nội dung, đủ dấu tiếng Việt); Material Symbols Outlined cho icon. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
</head>
<body>
    <div id="app">
        <div class="loading-screen">Đang tải BMS...</div>
    </div>

    <div id="blazor-error-ui">
        Đã xảy ra lỗi. <a href="" class="reload">Tải lại</a>
        <a class="dismiss"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;">close</span></a>
    </div>
    <div id="app-update" class="app-update" role="status" hidden>
        <span>Đã có phiên bản mới.</span>
        <button type="button" id="app-update-btn">Cập nhật</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Đăng ký service worker (PWA). Khi có bản triển khai mới, service worker mới cài xong sẽ
        // chờ; hiện thông báo để người dùng bấm "Cập nhật" -> kích hoạt bản mới rồi tải lại trang.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                const showUpdate = worker => {
                    const bar = document.getElementById('app-update');
                    bar.hidden = false;
                    document.getElementById('app-update-btn').onclick = () => worker.postMessage('SKIP_WAITING');
                };
                if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const worker = reg.installing;
                    worker?.addEventListener('statechange', () => {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate(worker);
                    });
                });
                // Kiểm tra bản mới mỗi khi quay lại ứng dụng.
                document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
            });
            // Chỉ tải lại khi THAY bản cũ (lần đầu cài, clients.claim() cũng phát sự kiện này).
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) return;
                reloading = true;
                location.reload();
            });
        }
    </script>
</body>
</html>
